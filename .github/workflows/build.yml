name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Containerfile -t claude .
      - run: docker run --rm -e AGENT_SANDBOX=0 claude --version
      - run: docker run --rm --entrypoint curl claude --version
      - run: docker run --rm --entrypoint go claude version
      - run: docker run --rm --entrypoint jq claude --version
      - run: docker run --rm --entrypoint python3 claude --version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o claude-launcher ./cmd/claude-launcher
      - env:
          AGENT_SANDBOX: "0"
          CONTAINER_CLI: docker
        run: script -qec "./claude-launcher --version" /dev/null | grep -q "Claude Code"
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        run: |
          docker tag claude ghcr.io/salisburygeneral/claude:latest
          docker push ghcr.io/salisburygeneral/claude:latest
